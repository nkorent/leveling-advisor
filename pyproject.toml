[project]
name = "leveling-advisor-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
# Install with: .venv/bin/pip install --index-url https://pypi.org/simple -e .
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "lupa==2.8",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
