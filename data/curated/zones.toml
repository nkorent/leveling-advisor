# Hand-maintained zones. Key = uiMapID. Written from the in-game census (data/census/maps.json) and the
# kept-quest faction evidence (see pipeline/zone_faction.py); edit by hand from here.
# faction: Alliance | Horde | Contested. Optional min_level / max_level override OpenMap levels and the computed
#   percentiles (none are set: OpenMap Levels.lua supplies them, quest percentiles fill the gaps).
# continent: the census continent uiMapID; omitted for a zone the census puts on no continent (Zephras Isle).
# kind: "city" | "battleground"; absent = a leveling zone.
# links: kind = walk | boat | zeppelin | tram | portal | flight; optional faction = Alliance | Horde.
# Generated links (links.generated.toml, `python -m pipeline poi`) are added to the zones defined here.
# A link here with the same (to, kind) replaces them. To drop generated links without replacing
# them, list them in the source zone: drop_generated = [[to, "kind"], ...], e.g.
#   drop_generated = [[1437, "walk"]]   # no generated walk links from this zone to 1437
# Comments show: kept quests, single-faction split (Alliance/Horde), evidence verdict.

